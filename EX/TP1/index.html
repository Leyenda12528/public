<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portal de Capacitación — Excel UDB</title>
  <link rel="icon" href="../assets/img/Logo.png" type="image/png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Overlay de inicio de sesión con DUI -->
  <div id="login-overlay" class="login-overlay">
    <div class="login-box">
      <div class="login-header-logo">
        <img id="login-logo" src="../assets/img/UDB_horizontal fondo oscuro.png" alt="Universidad Don Bosco">
      </div>
      <h2>Acceso</h2>
      
      <form id="login-form">
        <div class="login-input-wrap">
          <span class="dui-icon">🪪</span>
          <input type="text" id="dui-input" placeholder="00000000-0" maxlength="10" autocomplete="off" required>
        </div>
        <div id="login-error" class="login-error"></div>
        <button type="submit" class="login-btn">
          <span>Ingresar</span>
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
        </button>
      </form>
      
      <div class="login-demo-hint">
        <span>💡 DUI demo:</span>
        <button type="button" class="demo-dui-btn" id="demo-dui-btn">00000000-0</button>
      </div>

      <p class="login-footer">Acceso exclusivo para estudiantes y docentes inscritos.</p>
    </div>
  </div>

  <!-- Header Superior Principal -->
  <header class="header">
    <div class="header-inner">
      <div class="header-left">
        <div class="logo-wrapper">
          <img id="header-logo" src="../assets/img/UDB_horizontal fondo oscuro.png" alt="Universidad Don Bosco" class="header-logo">
        </div>
        <div class="header-divider"></div>
        <div class="header-text">
          <div class="header-tag" id="institucion-tag">Universidad Don Bosco</div>
          <h1 id="tema-name">Excel</h1>
          <p id="grupo-name">Grupo UDB</p>
        </div>
      </div>
      
      <div class="header-right">
        <div class="header-user" id="header-user" style="display:none;">
          <div class="user-avatar">🎓</div>
          <div class="user-details">
            <span class="user-label">Estudiante</span>
            <strong id="user-dui-badge">00000000-0</strong>
          </div>
          <button class="logout-btn" id="logout-btn" title="Cerrar sesión">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
            <span>Salir</span>
          </button>
        </div>
      </div>
    </div>
  </header>

  <!-- Navegación Amigable: Barra de Módulos (Tabs) + Filtros Integrados -->
  <nav class="nav-friendly-section" aria-label="Navegación de módulos">
    <div class="nav-friendly-inner">
      
      <!-- Contenedor de Pestañas de Módulos -->
      <div class="modules-tabs-wrapper">
        <div class="tabs-scroll-container" id="modules-tabs-bar">
          <!-- Se inyectan dinámicamente las pestañas amigables -->
        </div>
      </div>

      <!-- Barra de utilidad secundaria: Búsqueda y Orden amigable -->
      <div class="nav-secondary-bar">
        <!-- Buscador amigable -->
        <div class="search-friendly-box">
          <span class="search-icon">🔍</span>
          <input type="text" id="search-input" placeholder="Buscar por tema, guía o archivo...">
          <button id="search-clear" class="search-clear" style="display:none;" title="Limpiar búsqueda">✕</button>
        </div>

        <!-- Selector de orden interactivo -->
        <div class="nav-order-actions">
          <button id="order-toggle-btn" class="friendly-order-btn" title="Alternar orden de las sesiones">
            <span class="order-badge-icon" id="order-icon">⬇️</span>
            <span class="order-text-wrap">
              <small>Orden de sesiones</small>
              <strong id="order-label">Más reciente primero</strong>
            </span>
          </button>
        </div>
      </div>

    </div>
  </nav>

  <!-- Contenedor Principal -->
  <main class="container">
    <!-- Contenido inyectado dinámicamente -->
    <div id="main-content"></div>
  </main>

  <!-- Footer -->
  <footer class="footer">
    <div class="footer-inner">
      <div class="footer-left">
        <strong id="inst-name">Universidad Don Bosco</strong>
        <p>Instructor: <span id="prof-name">Ing. Jorge Rivera</span></p>
      </div>
      <div class="footer-right">
        <span class="footer-badge">Excel UDB · Edición 2026</span>
      </div>
    </div>
  </footer>

  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
