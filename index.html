<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Leyenda</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;}

body{
  position:relative;
  overflow:hidden;
  width:100vw;
  height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  background: #03050f;
}

.bg-base{
  position:absolute;
  inset:0;
  background:
    radial-gradient(ellipse 80% 60% at 50% 110%,
      rgba(20,5,60,.7) 0%,
      rgba(5,2,20,.5) 45%,
      transparent 70%),
    radial-gradient(ellipse 60% 50% at 15% 75%,
      rgba(10,0,60,.3) 0%,
      transparent 55%),
    radial-gradient(ellipse 50% 40% at 85% 70%,
      rgba(0,30,80,.2) 0%,
      transparent 50%),
    linear-gradient(180deg,
      #010103 0%,
      #030308 40%,
      #010103 100%);
}

.stars{
  position:absolute;
  inset:-50%;
  width:200%;
  height:200%;
  background-image:
    radial-gradient(rgba(255,255,255,.8) 1px, transparent 1px),
    radial-gradient(rgba(255,255,255,.4) 1px, transparent 1px),
    radial-gradient(rgba(180,210,255,.6) 1px, transparent 1px);
  background-size:120px 120px, 80px 80px, 200px 200px;
  background-position: 0 0, 40px 40px, 10px 70px;
  opacity:.3;
  animation: spinStars 240s linear infinite;
  z-index: 1;
}

@keyframes spinStars {
  0% { transform: rotate(0deg); }
  100% { transform: rotate(360deg); }
}

.distant-world {
  position: absolute;
  border-radius: 50%;
}
.dw1 {
  width: 12px; height: 12px;
  top: 30%; left: 30%;
  background: radial-gradient(circle at 30% 30%, #b8d4ff, #1a2b4c);
  box-shadow: 0 0 5px rgba(184,212,255,0.4);
}
.dw2 {
  width: 8px; height: 8px;
  bottom: 35%; right: 28%;
  background: radial-gradient(circle at 30% 30%, #ffd8b8, #4c2b1a);
  box-shadow: 0 0 4px rgba(255,216,184,0.3);
}
.dw3 {
  width: 14px; height: 14px;
  top: 65%; right: 35%;
  background: radial-gradient(circle at 30% 30%, #d8b8ff, #2b1a4c);
  box-shadow: 0 0 6px rgba(216,184,255,0.3);
}

.glow-center{
  position:absolute;
  width:700px;
  height:700px;
  border-radius:50%;
  background:radial-gradient(circle,
    rgba(0,120,220,.12) 0%,
    rgba(0,60,180,.03) 50%,
    transparent 70%);
}

.wave-bottom-purple{
  position:absolute;
  width:130%;
  height:380px;
  left:-15%;
  bottom:-140px;
  border-radius:50%;
  background:radial-gradient(ellipse at 40% 80%,
    rgba(80,20,200,.35) 0%,
    rgba(50,10,140,.1) 50%,
    transparent 80%);
}

.wave-bottom-blue{
  position:absolute;
  width:140%;
  height:350px;
  right:-20%;
  bottom:-160px;
  border-radius:50%;
  background:radial-gradient(ellipse at 60% 80%,
    rgba(0,100,220,.3) 0%,
    rgba(0,60,160,.1) 50%,
    transparent 80%);
}

.beam-left{
  position:absolute;
  width:400px;
  height:900px;
  left:-80px;
  bottom:-100px;
  background: linear-gradient(70deg,
    rgba(40,20,140,.15) 0%,
    rgba(0,80,200,.05) 50%,
    transparent 80%);
  border-radius:50%;
  transform:rotate(-15deg);
}

.beam-right{
  position:absolute;
  width:350px;
  height:800px;
  right:-60px;
  bottom:-80px;
  background: linear-gradient(250deg,
    rgba(0,80,200,.12) 0%,
    rgba(30,0,140,.04) 50%,
    transparent 80%);
  border-radius:50%;
  transform:rotate(15deg);
}

.horizon{
  position:absolute;
  width:100%;
  height:2px;
  bottom:28%;
  left:0;
  background: linear-gradient(90deg,
    transparent 0%,
    rgba(0,120,220,.0) 10%,
    rgba(60,140,220,.35) 30%,
    rgba(100,160,255,.5) 50%,
    rgba(60,140,220,.35) 70%,
    rgba(0,120,220,.0) 90%,
    transparent 100%);
}

.shooting-star{
  position:absolute;
  height:1.5px;
  border-radius:999px;
  background:linear-gradient(90deg,
    rgba(255,255,255,0) 0%,
    rgba(180,220,255,.9) 50%,
    rgba(255,255,255,1) 80%,
    rgba(255,255,255,0) 100%);
  opacity:0;
  z-index:50;
}

.s1{
  width:220px;
  top:22%;
  left:-240px;
  transform:rotate(-18deg);
  animation:shoot1 7s ease-in-out 1.5s infinite;
}

.s2{
  width:160px;
  top:58%;
  left:-180px;
  transform:rotate(-12deg);
  animation:shoot1 7s ease-in-out 4.8s infinite;
}

.s3{
  width:180px;
  top:35%;
  left:-200px;
  transform:rotate(-15deg);
  animation:shoot1 9s ease-in-out 3.2s infinite;
}

.s4{
  width:140px;
  top:10%;
  right:-200px;
  transform:rotate(195deg);
  animation:shoot2 8s ease-in-out 5s infinite;
}

@keyframes shoot1{
  0%{opacity:0; transform:rotate(-18deg) translateX(0);}
  5%{opacity:1;}
  40%{opacity:0; transform:rotate(-18deg) translateX(130vw);}
  100%{opacity:0; transform:rotate(-18deg) translateX(130vw);}
}

@keyframes shoot2{
  0%{opacity:0; transform:rotate(195deg) translateX(0);}
  5%{opacity:1;}
  40%{opacity:0; transform:rotate(195deg) translateX(130vw);}
  100%{opacity:0; transform:rotate(195deg) translateX(130vw);}
}

.logo{
  position:relative;
  z-index:100;
  width:700px;
  max-width:82vw;
  filter: drop-shadow(0 0 15px rgba(0,160,255,.3));
}
</style>
</head>
<body>

  <div class="bg-base"></div>
  <div class="stars">
    <div class="distant-world dw1"></div>
    <div class="distant-world dw2"></div>
    <div class="distant-world dw3"></div>
  </div>

  <div class="beam-left"></div>
  <div class="beam-right"></div>

  <div class="wave-bottom-purple"></div>
  <div class="wave-bottom-blue"></div>

  <div class="glow-center"></div>
  <div class="shooting-star s1"></div>
  <div class="shooting-star s2"></div>
  <div class="shooting-star s3"></div>
  <div class="shooting-star s4"></div>
  <div class="horizon"></div>

  <img
    src="https://leyenda12528.github.io/public/assets/img/Logo.png"
    class="logo"
    alt="Leyenda">

</body>
</html>
