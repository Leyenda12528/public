<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Escuela de Tecnología - Integración</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #050510;
      --card-bg: rgba(20, 25, 45, 0.7);
      --primary: #00e5ff;
      --secondary: #b05cff;
      --text: #ffffff;
      --text-muted: #94a3b8;
    }
    
    * { margin: 0; padding: 0; box-sizing: border-box; }
    
    body {
      font-family: 'Inter', sans-serif;
      background-color: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow-x: hidden;
      position: relative;
    }

    /* Background tech grid */
    .bg-grid {
      position: absolute;
      inset: 0;
      background-image: 
        linear-gradient(rgba(0, 229, 255, 0.05) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0, 229, 255, 0.05) 1px, transparent 1px);
      background-size: 50px 50px;
      z-index: 0;
    }
    
    .glow-blob {
      position: absolute;
      width: 400px;
      height: 400px;
      background: radial-gradient(circle, rgba(176,92,255,0.15) 0%, transparent 70%);
      top: -100px;
      left: -100px;
      border-radius: 50%;
      z-index: 0;
    }
    
    .glow-blob-2 {
      position: absolute;
      width: 500px;
      height: 500px;
      background: radial-gradient(circle, rgba(0,229,255,0.1) 0%, transparent 70%);
      bottom: -150px;
      right: -150px;
      border-radius: 50%;
      z-index: 0;
    }

    .container {
      position: relative;
      z-index: 10;
      text-align: center;
      padding: 2rem;
      max-width: 1000px;
      width: 100%;
    }

    h1 {
      font-size: 3.5rem;
      font-weight: 800;
      margin-bottom: 0.5rem;
      background: linear-gradient(90deg, var(--primary), var(--secondary));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-transform: uppercase;
      letter-spacing: 2px;
    }

    p.subtitle {
      font-size: 1.2rem;
      color: var(--text-muted);
      margin-bottom: 3rem;
    }

    /* Workshops Grid */
    .workshops {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 1.5rem;
      margin-bottom: 3rem;
    }

    .workshop-card {
      background: var(--card-bg);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 16px;
      padding: 1.5rem;
      transition: transform 0.3s ease, box-shadow 0.3s ease;
      backdrop-filter: blur(10px);
    }

    .workshop-card:hover {
      transform: translateY(-5px);
      box-shadow: 0 10px 20px rgba(0, 229, 255, 0.1);
      border-color: rgba(0, 229, 255, 0.3);
    }

    .icon {
      font-size: 2.5rem;
      margin-bottom: 1rem;
    }

    .workshop-card h3 {
      font-size: 1.1rem;
      font-weight: 600;
      line-height: 1.4;
      color: #e2e8f0;
    }

    /* Big Button */
    .btn-portal {
      display: inline-block;
      text-decoration: none;
      background: linear-gradient(45deg, var(--primary), var(--secondary));
      color: white;
      font-size: 1.3rem;
      font-weight: 700;
      padding: 1.2rem 3rem;
      border-radius: 50px;
      box-shadow: 0 0 20px rgba(0, 229, 255, 0.4);
      transition: all 0.3s ease;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .btn-portal:hover {
      box-shadow: 0 0 40px rgba(176, 92, 255, 0.6);
      transform: scale(1.05);
    }

    @media (max-width: 768px) {
      h1 { font-size: 2.5rem; }
      .workshops { grid-template-columns: 1fr 1fr; }
    }
    @media (max-width: 480px) {
      .workshops { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>

  <div class="bg-grid"></div>
  <div class="glow-blob"></div>
  <div class="glow-blob-2"></div>

  <div class="container">
    <h1>Escuela de Tecnología</h1>
    <p class="subtitle">Dirección de Integración</p>

    <div class="workshops">
      <div class="workshop-card">
        <div class="icon">📁</div>
        <h3>Organiza tu vida digital</h3>
      </div>
      <div class="workshop-card">
        <div class="icon">🤖</div>
        <h3>IA para la Vida diaria</h3>
      </div>
      <div class="workshop-card">
        <div class="icon">🚀</div>
        <h3>Emprende con IA</h3>
      </div>
      <div class="workshop-card">
        <div class="icon">💼</div>
        <h3>Herramientas para el trabajo</h3>
      </div>
    </div>

    <a href="escuelas-integradoras/index.html" class="btn-portal">Ingresar al Portal</a>
  </div>

</body>
</html>
